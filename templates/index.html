<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Converter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    {% include 'header.html' %}
    <div class="container">
        <h1>Document Converter</h1>
        <form action="/" method="post" enctype="multipart/form-data">
            <label for="file">Choose document:</label>
            <input type="file" name="file" id="file" required>

            <label for="output_format">Convert to:</label>
            <select name="output_format" id="output_format" required>
                <option value="">Select format</option>
                {% for fmt in formats %}
                    <option value="{{ fmt }}">{{ fmt.upper() }}</option>
                {% endfor %}
            </select>
            <button type="submit">Convert</button>
            <script>
            // Dynamically update output formats based on file type
            const fileInput = document.getElementById('file');
            const formatSelect = document.getElementById('output_format');
            const formatOptions = {
                pdf: ['docx', 'txt', 'image'],
                docx: ['txt', 'html', 'pdf']
            };
            const allFormats = [{% for fmt in formats %}'{{ fmt }}',{% endfor %}];

            fileInput.addEventListener('change', function() {
                const file = fileInput.files[0];
                let ext = '';
                if (file && file.name.includes('.')) {
                    ext = file.name.split('.').pop().toLowerCase();
                }
                let formats = allFormats;
                if (formatOptions[ext]) {
                    formats = formatOptions[ext];
                }
                // Clear and repopulate select
                formatSelect.innerHTML = '<option value="">Select format</option>';
                formats.forEach(function(fmt) {
                    const opt = document.createElement('option');
                    opt.value = fmt;
                    opt.textContent = fmt.toUpperCase();
                    formatSelect.appendChild(opt);
                });
            });
            </script>
        </form>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        {% if download_link %}
            <div class="success">
                {{ success }}
                <a href="{{ download_link }}">Download your file</a>
            </div>
        {% endif %} 
    </div>
</body>
</html>
